<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式课件中心 - 多学科学习平台</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 交互式课件中心</h1>
            <p>探索多学科的交互式学习体验</p>
            <p style="font-size: 1.1em; opacity: 0.8;">点击下方学科卡片开始学习之旅</p>
        </div>

        <div class="subject-grid">
            <!-- 数学 -->
            <div class="subject-card math-card">
                <div class="subject-icon">🧮</div>
                <h2 class="subject-title">数学</h2>
                <p class="subject-desc">从基础算术到高等数学，探索数学的奥秘与美感</p>
                <button class="subject-button" onclick="alert('数学课件正在开发中...')">进入学习</button>
            </div>

            <!-- 机器学习 -->
            <div class="subject-card ml-card">
                <div class="subject-icon">🤖</div>
                <h2 class="subject-title">机器学习</h2>
                <p class="subject-desc">回归、分类、聚类算法，人工智能的入门与实践</p>
                <a href="machine-learning/machine-learning-index.html" class="subject-button">进入学习</a>
            </div>

            <!-- 物理 -->
            <div class="subject-card physics-card">
                <div class="subject-icon">⚡</div>
                <h2 class="subject-title">物理</h2>
                <p class="subject-desc">力学、电磁学、光学，理解自然界的运行规律</p>
                <button class="subject-button" onclick="alert('物理课件正在开发中...')">进入学习</button>
            </div>

            <!-- 化学 -->
            <div class="subject-card chemistry-card">
                <div class="subject-icon">🧪</div>
                <h2 class="subject-title">化学</h2>
                <p class="subject-desc">元素周期、化学反应、分子结构，探索物质的组成与变化</p>
                <button class="subject-button" onclick="alert('化学课件正在开发中...')">进入学习</button>
            </div>

            <!-- 生物 -->
            <div class="subject-card biology-card">
                <div class="subject-icon">🧬</div>
                <h2 class="subject-title">生物</h2>
                <p class="subject-desc">细胞结构、遗传学、生态系统，了解生命的奥秘</p>
                <button class="subject-button" onclick="alert('生物课件正在开发中...')">进入学习</button>
            </div>

            <!-- 统计学 -->
            <div class="subject-card stats-card">
                <div class="subject-icon">📊</div>
                <h2 class="subject-title">统计学</h2>
                <p class="subject-desc">数据分析、概率分布、假设检验，掌握数据科学的基础</p>
                <button class="subject-button" onclick="alert('统计学课件正在开发中...')">进入学习</button>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 交互式课件中心 | 持续更新中...</p>
        </div>
    </div>

    <script>
        // 页面加载动画
        window.addEventListener('load', function() {
            document.querySelectorAll('.subject-card').forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 150);
            });
        });

        // 添加点击效果
        document.querySelectorAll('.subject-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (!e.target.classList.contains('subject-button')) {
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                }
            });
        });
    </script>
</body>
</html>
